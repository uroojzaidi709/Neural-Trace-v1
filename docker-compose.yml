services:
  db:
    image: postgres:15-alpine
    container_name: nt_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: neuraltrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuraltrace_db"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nt_redis_cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml-api:
    build: ./ml_model
    container_name: nt_ml_api
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./ml_model/model_output:/app/model_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api-backend
    container_name: nt_api
    restart: always
    env_file:
      - ./api-backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      # PDF reports persistent storage
      - forensic_reports:/app/forensic_reports
    depends_on:
      db:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  front-end:
    build: ./frontend
    container_name: nt_frontend
    restart: always
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  forensic_reports:    

  